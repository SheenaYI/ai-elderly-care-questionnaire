# Netlify 部署配置
#
# ⚠️ 重要：本文件位于**应用子目录**内。
#    你的 GitHub 仓库根目录下没有 package.json（应用在 work/ai-elderly-care-questionnaire/），
#    因此必须在 Netlify 里把 **Base directory** 设为 work/ai-elderly-care-questionnaire，
#    否则 Netlify 会在仓库根构建 → 找不到 package.json → publish 目录为空 → 全站 404。
#
#    推荐做法（二选一）：
#    A. 在 Netlify UI 里设置（推荐，最不易出错）：
#         Base directory   : work/ai-elderly-care-questionnaire
#         Build command    : npm run build
#         Publish directory: dist
#       注意：Base directory 一旦设置，下面 [build] 里的 command / publish
#       都应以该目录为基准写相对路径（即 "npm run build" 与 "dist"）。
#    B. 若 Netlify 的 Base directory 留空（从仓库根构建），
#       则改用下面 [build] 段里被注释掉的那组值。

[build]
  command = "npm run build"
  publish = "dist"

  # ── 若 Base directory 留空，改用下面这两行，并删掉上面两行 ──
  # command = "cd work/ai-elderly-care-questionnaire && npm ci && npm run build"
  # publish = "work/ai-elderly-care-questionnaire/dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless Functions 目录。
# Netlify 用 esbuild 打包，会跟随 import 到 netlify/functions/ 之外的
# `api/` 与 `src/`，因此业务逻辑只有一份实现（api/ 下那两个文件）。
# 以 `_` 开头的目录（_lib）不会被作为函数入口暴露。
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ── 路由规则（API 转发 + SPA 回退）统一放在 `public/_redirects` ────────────
# 原因：该文件会被 Vite 复制到 publish 目录（dist/_redirects），Netlify 一定会读取，
# 不受 Base directory 配置影响。把路由规则集中在一处，避免两套配置各说各话。
# 本文件只保留构建、functions 与响应头配置。

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
